name: Coleta diária

on:
  schedule:
    # 06:00 em America/Sao_Paulo = 09:00 UTC (UTC-3; o Brasil não tem horário de verão desde 2019).
    # O cron do GitHub é sempre em UTC e pode atrasar alguns minutos em horários de pico.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coletor
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          TZ: America/Sao_Paulo
        # Falha de uma fonte não quebra o passo (fica registrada em status.<fonte>).
        # O passo só falha se TODAS as fontes falharem.
        run: python collector/main.py

      - name: Commit e push (somente se houver mudanças)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças em docs/data."
            exit 0
          fi
          git commit -m "dados: resumo $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase --autostash
          git push
