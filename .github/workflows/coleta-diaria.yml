name: Coleta diária

on:
  schedule:
    # O cron do GitHub é sempre em UTC. São Paulo = UTC-3 (sem horário de verão desde 2019).
    # Agendamentos na virada da hora (ex.: "0 9") são os que mais atrasam ou são descartados
    # pelo GitHub em horários de pico, por isso os minutos "quebrados".
    - cron: "53 8 * * *"   # principal: 05:53 em São Paulo
    - cron: "23 9 * * *"   # reserva:   06:23 (só coleta se o resumo de hoje não existir)
    - cron: "13 11 * * *"  # reserva:   08:13 (idem)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta-diaria
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verificar se o resumo de hoje já existe
        id: verificar
        run: |
          hoje=$(TZ=America/Sao_Paulo date +%F)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/data/resumo-$hoje.json" ]; then
            echo "Resumo de $hoje já existe; execução de reserva ignorada."
            echo "pular=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python 3.12
        if: steps.verificar.outputs.pular != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        if: steps.verificar.outputs.pular != 'true'
        run: pip install -r requirements.txt

      - name: Rodar coletor
        if: steps.verificar.outputs.pular != 'true'
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
          TZ: America/Sao_Paulo
        # Falha de uma fonte não quebra o passo (fica registrada em status.<fonte>).
        # O passo só falha se TODAS as fontes falharem.
        run: python collector/main.py

      - name: Commit e push (somente se houver mudanças)
        if: steps.verificar.outputs.pular != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sem mudanças em docs/data."
            exit 0
          fi
          git commit -m "dados: resumo $(TZ=America/Sao_Paulo date +%F)"
          # docs/data é sempre regerado: em conflito (duas coletas quase simultâneas)
          # vence o que acabou de ser coletado. "-X theirs" no rebase = o commit sendo aplicado.
          for tentativa in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push falhou (tentativa $tentativa); rebase sobre o remoto"
            git pull --rebase -X theirs --autostash || { git rebase --abort || true; exit 1; }
          done
          echo "não foi possível enviar após 3 tentativas"
          exit 1
